name: Build APK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare file
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Ringtones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ringtones-APK
          path: dist/Ringtones.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Рингтоны 1.0"
          body: "Автоматическая сборка. Файл Ringtones.apk — для Android 7.0 и новее."
          files: dist/Ringtones.apk
          overwrite_files: true
          make_latest: true
